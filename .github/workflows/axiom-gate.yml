name: Axiom gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run at a time per branch and event; a run in progress is never canceled.
concurrency:
  group: axiom-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs elan and the toolchain pinned in lean-toolchain and restores the Mathlib
      # cache with lake exe cache get. The build runs in its own step below.
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          use-mathlib-cache: true
          use-github-cache: false
          build: false
          test: false
          lint: false

      - name: Toolchain version
        run: lean --version && lake --version

      # Constructs in the sources that AxiomGate.lean cannot see in the compiled environment,
      # placeholders outside Challenge.lean and IUT/Experimental/, imports of experimental
      # modules, imports of the challenge files, Lean options in lakefile.toml, and library
      # files missing from IUT.lean (about a second).
      - name: Source scan
        run: python3 -I scripts/Controls/source_scan.py

      - name: Root file check
        run: python3 -I scripts/gen_root.py --check

      # The default targets: the libraries IUT and Solution. Challenge.lean is not built here.
      - name: Build
        run: lake build

      # Fingerprints of the trusted definitions of Challenge/Defs.lean.
      - name: Fingerprint check
        run: python3 -I scripts/Controls/fingerprints.py --check

      # Source coverage input: the library files tracked in this checkout. Under CI the gate
      # refuses to run without this list.
      - name: List tracked library sources
        run: |
          git ls-files -- IUT.lean IUT > "$RUNNER_TEMP/tracked-files.txt"
          wc -l < "$RUNNER_TEMP/tracked-files.txt"

      - name: Axiom gate and source coverage
        env:
          AXIOM_GATE_TRACKED_FILES: ${{ runner.temp }}/tracked-files.txt
        run: lake env lean AxiomGate.lean

      # Compiling the gate as a module for the controls runs it on the library once more, and
      # the coverage control runs it with a tracked list of its own.
      - name: Gate controls
        env:
          AXIOM_GATE_TRACKED_FILES: ${{ runner.temp }}/tracked-files.txt
        run: sh GateControls/run.sh AxiomGate.lean

      # lake comparator and lake check run the project inside a bubblewrap sandbox. Ubuntu
      # 24.04 restricts unprivileged user namespaces through AppArmor, which bwrap needs.
      - name: Install the bubblewrap sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc true

      # Every theorem of comparator.json has in Solution the statement of Challenge, uses only
      # the permitted axioms, and is accepted by the kernel.
      - name: Comparator
        timeout-minutes: 60
        run: lake comparator

      # Exports the default targets and replays them through the kernel.
      - name: Kernel replay of the default targets
        timeout-minutes: 120
        run: lake check
